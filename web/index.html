<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rice-registry — preview</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/fake-desktop.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>rice-registry</strong>
        <span class="tagline">declarative ricing, MySpace-feel</span>
      </div>
      <a class="repo" href="https://github.com/phibkro/rice-registry" target="_blank" rel="noreferrer">
        github
      </a>
    </header>

    <main>
      <section class="preview-pane">
        <div class="preview-toolbar">
          <span class="preview-label">live preview</span>
          <div class="mode-toggle">
            <button id="mode-light" class="mode-button">light</button>
            <button id="mode-dark" class="mode-button active">dark</button>
          </div>
          <span class="preview-hint">click an item below to apply</span>
        </div>
        <div id="fake-desktop" class="fake-desktop dark"></div>
      </section>

      <section class="catalog">
        <div class="filter">
          <span class="filter-label">filter by your stack</span>
          <div id="tags" class="tags"></div>
          <input
            id="target-input"
            placeholder="add tag (e.g. hyprland) ↵"
            autocomplete="off"
            spellcheck="false"
          />
          <select id="type-filter" class="type-filter">
            <option value="">all types</option>
            <option value="registry:base">registry:base</option>
            <option value="registry:component">registry:component</option>
            <option value="registry:theme">registry:theme</option>
            <option value="registry:font">registry:font</option>
            <option value="registry:layout">registry:layout</option>
            <option value="registry:style">registry:style</option>
          </select>
        </div>
        <div id="items" class="items"></div>
      </section>

      <aside id="detail" class="detail">
        <p class="hint">select an item</p>
      </aside>
    </main>
  </body>
</html>
